name: CI

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t next-js-pipeline:ci .

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: next-js-pipeline:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::661609780698:role/github-actions-next-js-pipeline
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag next-js-pipeline:ci $REGISTRY/next-js-pipeline:$IMAGE_TAG
          docker push $REGISTRY/next-js-pipeline:$IMAGE_TAG

      - name: Render ECS task definition
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: aws/ecs/ecs-task-definition.json
          container-name: next-js-pipeline
          image: ${{ steps.login-ecr.outputs.registry }}/next-js-pipeline:${{ github.sha }}

      - name: Deploy to ECS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: next-js-pipeline-service
          cluster: next-js-pipeline-cluster
          wait-for-service-stability: true
